rules:
  - id: lab.python.sql-string-formatting
    languages: [python]
    severity: ERROR
    message: SQL built with string formatting from request data; use parameterised queries.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: $Q = "..." % $X
          - pattern: $Q = "...".format(...)
          - pattern: $Q = f"..."
      - metavariable-regex:
          metavariable: $Q
          regex: (?i)^(query|sql|stmt)$
      - pattern-inside: |
          def $F(...):
              ...
              $X = request.$ARGS.get(...)
              ...

  - id: lab.python.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: shell=True with a non-constant command allows OS command injection.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: lab.python.flask-debug-true
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes the Werkzeug console and must not ship to production.
    metadata:
      cwe: "CWE-489"
      owasp: "A05:2021 Security Misconfiguration"
    pattern: $APP.run(..., debug=True, ...)

  - id: lab.python.hardcoded-secret
    languages: [python]
    severity: ERROR
    message: Hard-coded credential; load from a secret manager or environment instead.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 Identification and Authentication Failures"
    patterns:
      - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|password|api_?key|token).*
