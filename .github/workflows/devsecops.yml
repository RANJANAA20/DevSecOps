name: devsecops

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  id-token: write          # keyless Cosign signing via OIDC

env:
  APP_DIR: devsecops/app-or-lab-target

jobs:
  # Fast checks on every PR; these results appear as PR annotations.
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config devsecops/sast/semgrep-rules.yml --metrics=off \
            --sarif --output semgrep.sarif $APP_DIR || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

      - name: Dependency, secret and IaC scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }

  # Build, SBOM, sign, DAST. Runs only after PR checks pass, on main.
  build-sign-dast:
    needs: pr-checks
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lab-app:${{ github.sha }} $APP_DIR

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lab-app:${{ github.sha }}
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: lab-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Start app for DAST
        run: |
          docker run -d --name lab -p 5000:5000 lab-app:${{ github.sha }}
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:5000/; do sleep 1; done'

      - name: DAST baseline (ZAP, passive only)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://127.0.0.1:5000
          fail_action: false   # report mode in the lab; set true to gate

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless) and attach SBOM attestation
        run: |
          # Production: push to registry first, then sign by digest.
          cosign sign --yes $REGISTRY/lab-app@$DIGEST
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson $REGISTRY/lab-app@$DIGEST
        if: ${{ env.REGISTRY != '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: |
            trivy-image.json
            sbom.spdx.json
            report_html.html
            report_json.json
          retention-days: 90
